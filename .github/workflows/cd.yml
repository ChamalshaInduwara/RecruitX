name: RecruitX CD

on:
  workflow_run:
    workflows:
      - RecruitX CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Deploy backend to Render
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl --fail \
            --show-error \
            --silent \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Backend deployment not configured
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "Render deployment target is not configured yet."
          echo "Backend deployment skipped safely."

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check frontend deployment configuration
        id: vercel-config
        run: |
          if [ -n "$VERCEL_TOKEN" ] && \
             [ -n "$VERCEL_ORG_ID" ] && \
             [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout production commit
        if: steps.vercel-config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        if: steps.vercel-config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pull Vercel configuration
        if: steps.vercel-config.outputs.configured == 'true'
        working-directory: frontend
        run: |
          npx --yes vercel@latest pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build frontend for Vercel
        if: steps.vercel-config.outputs.configured == 'true'
        working-directory: frontend
        run: |
          npx --yes vercel@latest build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Deploy frontend to Vercel
        if: steps.vercel-config.outputs.configured == 'true'
        working-directory: frontend
        run: |
          npx --yes vercel@latest deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Frontend deployment not configured
        if: steps.vercel-config.outputs.configured == 'false'
        run: |
          echo "Vercel deployment target is not configured yet."
          echo "Frontend deployment skipped safely."